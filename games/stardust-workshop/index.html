<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星尘工坊 Stardust Workshop</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #060a14;
        overflow: hidden;
      }
      /* 固定定位 + 弹性居中：杜绝分屏/小窗格等容器里出现滚动偏移导致画面顶部被裁 */
      body {
        position: fixed;
        inset: 0;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BJPcGvHw.js"></script>
  </head>
  <body>
    <div id="game-root"></div>
    <script>
      // 临时调试：把运行时错误显示在画面上（定位 v0.5.0 循环冻结问题，确认后移除）
      window.addEventListener("error", function (e) {
        var d = document.createElement("div");
        d.style.cssText =
          "position:fixed;top:0;left:0;z-index:9999;background:#5c1010;color:#fff;font:13px monospace;padding:6px;max-width:100vw;white-space:pre-wrap;";
        d.textContent = "ERR: " + e.message + " @ " + (e.filename || "") + ":" + e.lineno;
        document.body.appendChild(d);
      });
    </script>
  </body>
</html>
