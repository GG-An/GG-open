<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星尘工坊 Stardust Workshop</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #060a14;
        overflow: hidden;
      }
      /* 固定定位 + 弹性居中：杜绝分屏/小窗格等容器里出现滚动偏移导致画面顶部被裁 */
      body {
        position: fixed;
        inset: 0;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 启动加载画面（v0.8.0）：公网首访资源下载期间的正反馈 */
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(ellipse at 50% 30%, #101c33 0%, #060a14 60%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: opacity 0.45s ease;
      }
      #boot-screen.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-title {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 42px;
        color: #e2e8f0;
        letter-spacing: 2px;
        text-shadow: 0 0 26px rgba(34, 211, 238, 0.5);
      }
      .boot-sub {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #64748b;
        letter-spacing: 6px;
        font-size: 12px;
        margin-top: -6px;
      }
      .boot-bar {
        width: 280px;
        height: 6px;
        border-radius: 3px;
        background: #1e293b;
        overflow: hidden;
        margin-top: 14px;
      }
      .boot-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #22d3ee, #a5f3fc);
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
        transition: width 0.2s ease;
      }
      .boot-fill.indeterminate {
        width: 32% !important;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          margin-left: 0;
        }
        to {
          margin-left: 68%;
        }
      }
      .boot-tip {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #475569;
        font-size: 12px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-I3Vo4ZvB.js"></script>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-title">✨ 星尘工坊</div>
      <div class="boot-sub">STARDUST WORKSHOP</div>
      <div class="boot-bar"><div class="boot-fill indeterminate" id="boot-fill"></div></div>
      <div class="boot-tip">正在点亮星尘…</div>
    </div>
    <div id="game-root"></div>
    <script>
      // 启动画面钩子：由 BootScene 在资源加载与启动完成时调用
      window.updateBootProgress = function (p) {
        var f = document.getElementById("boot-fill");
        if (!f) return;
        f.classList.remove("indeterminate");
        f.style.width = Math.round(p * 100) + "%";
      };
      window.hideBootScreen = function () {
        var s = document.getElementById("boot-screen");
        if (!s) return;
        s.classList.add("hide");
        setTimeout(function () {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 500);
      };
      // 运行错误悬浮提示（常驻：公网玩家遇到异常时可直接截图反馈）
      window.addEventListener("error", function (e) {
        var st =
          e.error && e.error.stack
            ? "\n" + e.error.stack.split("\n").slice(0, 4).join("\n")
            : "";
        var d = document.createElement("div");
        d.style.cssText =
          "position:fixed;bottom:8px;left:8px;z-index:9999;background:#5c1010;color:#fff;font:12px monospace;padding:6px;max-width:100vw;white-space:pre-wrap;border-radius:6px;";
        d.textContent = "⚠ " + e.message + st;
        document.body.appendChild(d);
      });
    </script>
  </body>
</html>
