<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云隐山志 · 修仙养成</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1410;
        overflow: hidden;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(ellipse at 50% 30%, #17251c 0%, #0a0f0c 60%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: opacity 0.45s ease;
      }
      #boot-screen.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-title {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 40px;
        color: #dce8dc;
        letter-spacing: 3px;
        text-shadow: 0 0 22px rgba(74, 222, 128, 0.4);
      }
      .boot-sub {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #5a6e5a;
        letter-spacing: 5px;
        font-size: 12px;
        margin-top: -6px;
      }
      .boot-bar {
        width: 280px;
        height: 6px;
        border-radius: 3px;
        background: #1c2a20;
        overflow: hidden;
        margin-top: 14px;
      }
      .boot-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4ade80, #bbf7d0);
        box-shadow: 0 0 12px rgba(74, 222, 128, 0.7);
        transition: width 0.2s ease;
      }
      .boot-tip {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #4a5c4a;
        font-size: 12px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Dwue1to2.js"></script>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-title">⛰️ 云隐山志</div>
      <div class="boot-sub">YUNYIN MOUNTAIN CHRONICLE</div>
      <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
      <div class="boot-tip">正在入定…</div>
    </div>
    <div id="game-root"></div>
    <script>
      window.updateBootProgress = function (p) {
        var f = document.getElementById("boot-fill");
        if (f) f.style.width = Math.round(p * 100) + "%";
      };
      window.hideBootScreen = function () {
        var s = document.getElementById("boot-screen");
        if (!s) return;
        s.classList.add("hide");
        setTimeout(function () {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 500);
      };
      window.addEventListener("error", function (e) {
        var st =
          e.error && e.error.stack
            ? "\n" + e.error.stack.split("\n").slice(0, 4).join("\n")
            : "";
        var d = document.createElement("div");
        d.style.cssText =
          "position:fixed;bottom:8px;left:8px;z-index:9999;background:#4a1010;color:#fff;font:12px monospace;padding:6px;max-width:100vw;white-space:pre-wrap;border-radius:6px;";
        d.textContent = "⚠ " + e.message + st;
        document.body.appendChild(d);
      });
    </script>
  </body>
</html>
